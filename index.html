<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0C0C0C">
<meta name="robots" content="noindex, nofollow">
<title>Параплан</title>
<link rel="stylesheet" href="https://svetlana020257-lab.github.io/paraplan/dashboard-fonts.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23E87A1E'/%3E%3Ctext x='32' y='44' font-family='Arial Black,Arial' font-weight='900' font-size='34' text-anchor='middle' fill='white'%3E%D0%9F%3C/text%3E%3C/svg%3E">
<style>
:root {
  --or: #E87A1E; --or-l: #F5A04A; --or-glow: rgba(232,122,30,.25);
  --bg: #0C0C0C; --s1: #161616; --s2: #1E1E1E; --s3: #272727;
  --t1: #F2EDE6; --t2: #A09890; --t3: #6A6058; --line: #2A2A2A;
  --fh: 'PP Unbounded', 'Arial Black', sans-serif;
  --fb: 'PP Golos', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--t1); font-family: var(--fb); -webkit-font-smoothing: antialiased; }
body { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; padding: max(28px, env(safe-area-inset-top)) 18px max(24px, env(safe-area-inset-bottom));
  background: radial-gradient(60rem 30rem at 50% -10%, rgba(232,122,30,.16), transparent 70%), var(--bg); }
.wrap { width: 100%; max-width: 440px; display: grid; gap: 22px; margin: auto 0; }
.head { display: grid; justify-items: center; gap: 12px; text-align: center; }
.logo { width: 76px; height: 76px; border-radius: 22px; background: var(--or); color: #fff; display: flex; align-items: center; justify-content: center; font-family: var(--fh); font-weight: 900; font-size: 34px; box-shadow: 0 0 50px var(--or-glow); }
h1 { font-family: var(--fh); font-weight: 900; font-size: 26px; letter-spacing: .06em; margin: 0; }
.sub { color: var(--t2); font-size: 14px; margin: -4px 0 0; }
.tiles { display: grid; gap: 12px; }
.tile { display: grid; grid-template-columns: 52px 1fr 20px; align-items: center; gap: 14px; padding: 16px; background: var(--s1); border: 1px solid var(--line); border-radius: 16px; color: inherit; text-decoration: none; transition: border-color .15s, transform .1s, background .15s; }
.tile:hover { border-color: var(--or); background: #1a1a1a; }
.tile:active { transform: scale(.985); }
.tile:focus-visible { outline: 2px solid var(--or); outline-offset: 3px; }
.ic { width: 52px; height: 52px; border-radius: 14px; background: var(--s3); display: flex; align-items: center; justify-content: center; }
.tile.main .ic { background: var(--or); box-shadow: 0 0 20px var(--or-glow); }
.ic svg { width: 26px; height: 26px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tile:not(.main) .ic svg { stroke: var(--or-l); }
.tt { display: grid; gap: 3px; min-width: 0; }
.tt b { font-family: var(--fh); font-weight: 700; font-size: 15px; letter-spacing: .02em; }
.tt span { color: var(--t2); font-size: 13px; line-height: 1.35; }
.arr { color: var(--t3); font-size: 18px; }
.lbl { font-size: 10.5px; color: var(--t3); text-transform: uppercase; letter-spacing: .1em; margin: 4px 0 -4px 4px; }
.staff { display: flex; justify-content: center; }
.staff a { display: inline-flex; align-items: center; gap: 8px; color: var(--t3); text-decoration: none; font-size: 13px; padding: 8px 14px; border: 1px solid var(--line); border-radius: 999px; transition: color .15s, border-color .15s; }
.staff a:hover { color: var(--t1); border-color: var(--t3); }
.staff svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
footer { color: var(--t3); font-size: 11.5px; text-align: center; margin-top: 18px; }
</style>
</head>
<body>
<main class="wrap">
  <div class="head">
    <div class="logo" aria-hidden="true">П</div>
    <h1>ПАРАПЛАН</h1>
    <p class="sub">Всё для работы в одном месте</p>
  </div>

  <div class="tiles">
    <p class="lbl">Для продавцов</p>
    <a class="tile main" href="https://svetlana020257-lab.github.io/paraplan/">
      <span class="ic"><svg viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="3"/><path d="M9 18h6"/></svg></span>
      <span class="tt"><b>Приложение</b><span>План точки и зарплата</span></span>
      <span class="arr" aria-hidden="true">→</span>
    </a>
    <a class="tile" href="https://svetlana020257-lab.github.io/obuchenie/">
      <span class="ic"><svg viewBox="0 0 24 24"><path d="M2 6.5 12 3l10 3.5-10 3.5z"/><path d="M6 8.5v5c0 1.7 2.7 3 6 3s6-1.3 6-3v-5"/><path d="M22 6.5V12"/></svg></span>
      <span class="tt"><b>Обучение</b><span>Стажировочная тетрадь: товары, заказы, инвентаризация и тесты</span></span>
      <span class="arr" aria-hidden="true">→</span>
    </a>
  </div>

  <div class="staff">
    <a href="https://svetlana020257-lab.github.io/paraplan/dashboard.html">
      <svg viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      Штаб — вход по паролю
    </a>
  </div>
</main>
<footer>Параплан · Новосибирск</footer>
</body>
</html>
